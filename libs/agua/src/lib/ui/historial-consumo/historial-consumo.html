<div class="chart-container p-4 border rounded-lg shadow-sm bg-white">
  <h3 class="text-lg font-semibold mb-4 text-slate-800">
    Historial de Consumo (12 Meses)
  </h3>

  @defer (on viewport) { @if (state().status === 'loading') {
  <div
    class="h-[300px] flex items-center justify-center animate-pulse bg-slate-50"
  >
    <span class="text-slate-400">Cargando datos históricos...</span>
  </div>
  } @else if (state().status === 'error') {
  <div class="h-[300px] flex items-center justify-center text-red-500">
    {{ state().error }}
  </div>
  } @else if (state().status === 'success') {
  <div class="h-[300px]">
    <canvas
      baseChart
      [data]="chartData()"
      [options]="chartOptions"
      [type]="chartType"
    >
    </canvas>
  </div>

  <div class="mt-4 text-sm text-slate-500 flex gap-4 justify-center">
    <span class="flex items-center gap-1">
      <span class="w-3 h-3 bg-blue-500 rounded-full"></span> Consumo Real
    </span>
    <span class="flex items-center gap-1">
      <span class="w-3 h-3 bg-red-400 rounded-full"></span> Promedio
    </span>
  </div>
  } } @placeholder {
  <div class="h-[300px] bg-slate-100 flex items-center justify-center rounded">
    <span class="text-slate-500 font-medium">Cargando gráfica...</span>
  </div>
  }
</div>
