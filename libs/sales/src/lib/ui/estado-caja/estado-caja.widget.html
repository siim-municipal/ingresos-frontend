<div
  class="flex items-center gap-4 p-4 bg-white rounded-lg shadow-sm border border-slate-200"
>
  <div class="flex items-center gap-3">
    <div
      class="w-10 h-10 rounded-full flex items-center justify-center"
      [ngClass]="store.isOpen() ? 'bg-green-100 text-green-600' : 'bg-slate-100 text-slate-400'"
    >
      <mat-icon>{{ store.isOpen() ? 'lock_open' : 'lock' }}</mat-icon>
    </div>
    <div>
      <p class="text-xs font-bold text-slate-500 uppercase tracking-wide">
        Estado de Caja
      </p>
      @if (store.isOpen()) {
      <p class="text-sm font-bold text-green-700">SESIÓN ABIERTA</p>
      <p class="text-[10px] text-slate-400 font-mono">
        {{ store.sesionId()?.slice(0,8) }}...
      </p>
      } @else {
      <p class="text-sm font-bold text-slate-700">CERRADA</p>
      }
    </div>
  </div>

  <div class="border-l border-slate-200 pl-4 ml-auto">
    @if (!store.isOpen()) {
    <button mat-flat-button color="primary" (click)="abrirModal()">
      Abrir Caja
    </button>
    } @else {
    <button mat-stroked-button color="warn" (click)="cerrarSesion()">
      Hacer Corte (Cierre)
    </button>
    }
  </div>
</div>
